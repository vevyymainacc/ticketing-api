x-api: &api
  build: .
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/ticketing
    BIND_ADDR: 0.0.0.0:8080
    RUST_LOG: warn
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api1:
    <<: *api
  api2:
    <<: *api
  api3:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
      - api3
    ports:
      - "8088:80"
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
